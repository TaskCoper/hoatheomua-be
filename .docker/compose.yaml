x-postgres-base: &postgres-base
  image: postgres:15-alpine
  restart: unless-stopped
  environment:
    POSTGRES_DB: ${POSTGRES_DBNAME}
    POSTGRES_USER: ${POSTGRES_USERNAME}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    TZ: UTC
    PGTZ: UTC

x-rabbitmq-base: &rabbitmq-base
  image: rabbitmq:4-management-alpine
  restart: unless-stopped
  environment:
    RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
    RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
    interval: 10s
    timeout: 5s
    retries: 10

x-cloudflare-tunnel: &cloudflare-tunnel
  image: cloudflare/cloudflared
  restart: unless-stopped
  command: tunnel run
  environment:
    - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}

x-api-env: &api-env
  TZ: Asia/Bangkok
  Environment: ${ENVIRONMENT}
  ASPNETCORE_ENVIRONMENT: ${ENVIRONMENT}
  ASPNETCORE_URLS: http://+:8080
  HttpPort: ${HTTP_PORT}

  # The API has no published host port in this compose file and is reached through cloudflared.
  ReverseProxy__TrustForwardedHeaders: "true"

  # Postgres
  PostgresOption__MaxIdleConns: ${POSTGRES_MAX_IDLE_CONNS}
  PostgresOption__MaxOpenConns: ${POSTGRES_MAX_OPEN_CONNS}
  PostgresOption__ConnMaxLifetime: ${POSTGRES_CONN_MAX_LIFETIME}

  # JWT (validation only — this service no longer issues tokens; taskcoper-be does.
  # These three MUST be identical to taskcoper-be's values for cross-service tokens to validate.)
  JwtOption__Issuer: ${JWT_ISSUER}
  JwtOption__Audience: ${JWT_AUDIENCE}
  JwtOption__AccessTokenKey: ${JWT_ACCESS_TOKEN_KEY}

  # AI Flower storage (runtime login -> presign -> PNG upload).
  TASKCOPER_API_BASE: ${TASKCOPER_API_BASE:-https://hoatheomua-taskcoper-api.bentran1vn.com}
  TASKCOPER_EMAIL: ${TASKCOPER_EMAIL:-}
  TASKCOPER_PASSWORD: ${TASKCOPER_PASSWORD:-}
  TASKCOPER_STORAGE_PREFIX: ${TASKCOPER_STORAGE_PREFIX:-general/ai-flowers}
  FlowerImage__PublicBaseUrl: ${FLOWER_IMAGE_PUBLIC_BASE_URL:-}

  # AI proxy (PostGen paraphrase content/images, AI Flower, AI Card). The default host only
  # resolves when the API container shares a Docker network with chatgpt-proxy-prod.
  AiOption__ChatCompletionsUrl: ${AI_CHAT_COMPLETIONS_URL:-http://chatgpt-proxy-prod:1435/v1/chat/completions}
  AiOption__Model: ${AI_MODEL:-chatgpt/gpt-5.6}
  AiOption__ApiKey: ${AI_API_KEY:-}
  AiOption__TimeoutSeconds: ${AI_TIMEOUT_SECONDS:-120}

  # PostGen accounts (runtime only; Meta and Zalo opt-in).
  PlatformAccountOptions__Meta__Enabled: ${POSTGEN_META_ENABLED:-false}
  PlatformAccountOptions__Meta__AppId: ${POSTGEN_META_APP_ID:-}
  PlatformAccountOptions__Meta__AppSecret: ${POSTGEN_META_APP_SECRET:-}
  PlatformAccountOptions__Meta__GraphApiVersion: ${POSTGEN_META_GRAPH_API_VERSION:-}
  PlatformAccountOptions__Meta__ConfigId: ${POSTGEN_META_CONFIG_ID:-}
  PlatformAccountOptions__Meta__FacebookCallbackUrl: ${POSTGEN_META_FACEBOOK_CALLBACK_URL:-}
  PlatformAccountOptions__Meta__InstagramCallbackUrl: ${POSTGEN_META_INSTAGRAM_CALLBACK_URL:-}
  PlatformAccountOptions__ActiveEncryptionKeyId: ${POSTGEN_ACTIVE_ENCRYPTION_KEY_ID:-k1}
  PlatformAccountOptions__EncryptionKeys__k1: ${POSTGEN_ENCRYPTION_KEY_K1:-}
  PlatformAccountOptions__EncryptionKeys__k2: ${POSTGEN_ENCRYPTION_KEY_K2:-}
  PlatformAccountOptions__OAuthStateMinutes: ${POSTGEN_OAUTH_STATE_MINUTES:-10}
  PlatformAccountOptions__RequestTimeoutSeconds: ${POSTGEN_REQUEST_TIMEOUT_SECONDS:-30}
  PlatformAccountOptions__Zalo__Enabled: ${POSTGEN_ZALO_ENABLED:-false}
  PlatformAccountOptions__Zalo__AppId: ${POSTGEN_ZALO_APP_ID:-}
  PlatformAccountOptions__Zalo__AppSecret: ${POSTGEN_ZALO_APP_SECRET:-}
  PlatformAccountOptions__Zalo__CallbackUrl: ${POSTGEN_ZALO_CALLBACK_URL:-}
  PublishingOptions__FacebookEnabled: ${POSTGEN_PUBLISH_FACEBOOK_ENABLED:-false}
  PublishingOptions__InstagramEnabled: ${POSTGEN_PUBLISH_INSTAGRAM_ENABLED:-false}
  PublishingOptions__MinScheduleLeadSeconds: ${POSTGEN_SCHEDULE_MIN_LEAD_SECONDS:-60}
  PublishingOptions__MaxScheduleDays: ${POSTGEN_SCHEDULE_MAX_DAYS:-30}
  PublishingOptions__ScheduleLatenessSeconds: ${POSTGEN_SCHEDULE_LATENESS_SECONDS:-900}

  # Ahamove
  AhamoveOption__Token: ${AHAMOVE_TOKEN}
  AhamoveOption__BaseUrl: ${AHAMOVE_BASE_URL}

  # XanhSM Express
  XanhSmOptions__BaseUrl: ${XANHSM_BASE_URL}
  XanhSmOptions__TokenUrl: ${XANHSM_TOKEN_URL}
  XanhSmOptions__Scope: ${XANHSM_SCOPE}
  XanhSmOptions__ClientId: ${XANHSM_CLIENT_ID}
  XanhSmOptions__ClientSecret: ${XANHSM_CLIENT_SECRET}
  XanhSmOptions__AcceptLanguage: ${XANHSM_ACCEPT_LANGUAGE}
  XanhSmWebhookOptions__Environment: ${XANHSM_WEBHOOK_ENVIRONMENT:-}
  XanhSmWebhookOptions__SigningKey: ${XANHSM_WEBHOOK_SIGNING_KEY:-}
  XanhSmWebhookOptions__SecondarySigningKey: ${XANHSM_WEBHOOK_SECONDARY_SIGNING_KEY:-}

  # NhanhVn
  NhanhVnOption__Token: ${NHANHVN_TOKEN}
  NhanhVnOption__AppId: ${NHANHVN_APP_ID}
  NhanhVnOption__BusinessId: ${NHANHVN_BUSINESS_ID}
  NhanhVnOption__BaseUrl: ${NHANHVN_BASE_URL}

  # BaoKim (payment gateway — the keys are PEM blocks; their newlines pass through as-is).
  # PrivateKey signs our outbound calls; PublicKey is BaoKim's, used to verify inbound webhooks.
  BaoKimOption__BaseUrl: ${BAOKIM_BASE_URL}
  BaoKimOption__MerchantCode: ${BAOKIM_MERCHANT_CODE}
  BaoKimOption__ClientId: ${BAOKIM_CLIENT_ID}
  BaoKimOption__ClientSecret: ${BAOKIM_CLIENT_SECRET}
  BaoKimOption__PrivateKey: ${BAOKIM_PRIVATE_KEY}
  BaoKimOption__PublicKey: ${BAOKIM_PUBLIC_KEY}

  SepayOption__ApiKey: ${SEPAY_API_KEY}

  # RabbitMQ (MassTransit). Host đặt riêng ở từng service vì khác nhau giữa dev/prod.
  RabbitMqOptions__Port: 5672
  RabbitMqOptions__VirtualHost: ${RABBITMQ_VHOST:-/}
  RabbitMqOptions__Username: ${RABBITMQ_USERNAME}
  RabbitMqOptions__Password: ${RABBITMQ_PASSWORD}

  # Revalidate (outbound cache purge to the storefront: POST BaseUrl with "x-revalidate-secret: <SecretKey>")
  SecretOptions__BaseUrl: ${SECRET_BASE_URL}
  SecretOptions__SecretKey: ${SECRET_KEY}

  AllowedHosts: "*"

x-api-base: &api-base
  image: ${REGISTRY}/hoatheomua-api:${TAG:-latest}
  build:
    context: ..
    dockerfile: HoaTheoMua.API/Dockerfile
  restart: unless-stopped

services:
  hoatheomua-postgres-dev:
    <<: *postgres-base
    container_name: hoatheomua-postgres-dev
    hostname: hoatheomua-postgres-dev
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    networks: [hoatheomua-network-dev]
    volumes:
      - postgres-hoatheomua-data-dev:/var/lib/postgresql/data
    profiles: [dev, database-dev, database, dev-pull]

  hoatheomua-postgres-prod:
    <<: *postgres-base
    container_name: hoatheomua-postgres-prod
    hostname: hoatheomua-postgres-prod
    ports: ["${POSTGRES_PORT:-5433}:5432"]
    networks: [hoatheomua-network-prod]
    volumes:
      - postgres-hoatheomua-data-prod:/var/lib/postgresql/data
    profiles: [prod, database-prod, database, prod-pull]

  hoatheomua-rabbitmq-dev:
    <<: *rabbitmq-base
    container_name: hoatheomua-rabbitmq-dev
    hostname: hoatheomua-rabbitmq-dev
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    networks: [hoatheomua-network-dev]
    volumes:
      - rabbitmq-hoatheomua-data-dev:/var/lib/rabbitmq
    profiles: [dev, rabbitmq-dev, rabbitmq, dev-pull]

  hoatheomua-rabbitmq-prod:
    <<: *rabbitmq-base
    container_name: hoatheomua-rabbitmq-prod
    hostname: hoatheomua-rabbitmq-prod
    ports:
      - "${RABBITMQ_PORT:-5673}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    networks: [hoatheomua-network-prod]
    volumes:
      - rabbitmq-hoatheomua-data-prod:/var/lib/rabbitmq
    profiles: [prod, rabbitmq-prod, rabbitmq, prod-pull]

  hoatheomua-api-dev:
    <<: *api-base
    container_name: hoatheomua-api-dev
    hostname: hoatheomua-api-dev
    environment:
      <<: *api-env
      ConnectionStrings__PostgresSql: Host=hoatheomua-postgres-dev;Port=5432;Database=${POSTGRES_DBNAME};Username=${POSTGRES_USERNAME};Password=${POSTGRES_PASSWORD}
      RabbitMqOptions__Host: hoatheomua-rabbitmq-dev
    # ports:
    #   - "${HTTP_PORT}:8080"
    networks: [hoatheomua-network-dev]
    profiles: [dev, api-dev, api, dev-pull]

  hoatheomua-api-prod:
    <<: *api-base
    container_name: hoatheomua-api-prod
    hostname: hoatheomua-api-prod
    environment:
      <<: *api-env
      ConnectionStrings__PostgresSql: Host=hoatheomua-postgres-prod;Port=5432;Database=${POSTGRES_DBNAME};Username=${POSTGRES_USERNAME};Password=${POSTGRES_PASSWORD}
      RabbitMqOptions__Host: hoatheomua-rabbitmq-prod
    # ports:
    #   - "${HTTP_PORT}:8080"
    networks: [hoatheomua-network-prod]
    profiles: [prod, api-prod, api, prod-pull]

  hoatheomua-cloudflare-dev:
    <<: *cloudflare-tunnel
    container_name: hoatheomua-cloudflare-dev
    hostname: hoatheomua-cloudflare-dev
    networks: [hoatheomua-network-dev]
    profiles: [dev, cloudflare-dev, proxy, dev-pull]

volumes:
  postgres-hoatheomua-data-dev:
    name: postgres-hoatheomua-data-dev
    driver: local
  postgres-hoatheomua-data-prod:
    name: postgres-hoatheomua-data-prod
    driver: local
  rabbitmq-hoatheomua-data-dev:
    name: rabbitmq-hoatheomua-data-dev
    driver: local
  rabbitmq-hoatheomua-data-prod:
    name: rabbitmq-hoatheomua-data-prod
    driver: local

networks:
  hoatheomua-network-dev:
    name: hoatheomua-network-dev
    driver: bridge
    ipam:
      driver: default
  hoatheomua-network-prod:
    name: hoatheomua-network-prod
    driver: bridge
    ipam:
      driver: default
