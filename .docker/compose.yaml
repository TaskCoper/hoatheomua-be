x-postgres-base: &postgres-base
  image: postgres:15-alpine
  restart: unless-stopped
  environment:
    POSTGRES_DB: ${POSTGRES_DBNAME}
    POSTGRES_USER: ${POSTGRES_USERNAME}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    TZ: UTC
    PGTZ: UTC

x-cloudflare-tunnel: &cloudflare-tunnel
  image: cloudflare/cloudflared
  restart: unless-stopped
  command: tunnel run
  environment:
    - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}

x-api-env: &api-env
  TZ: Asia/Bangkok
  Environment: ${ENVIRONMENT}
  ASPNETCORE_ENVIRONMENT: ${ENVIRONMENT}
  ASPNETCORE_URLS: http://+:8080
  HttpPort: ${HTTP_PORT}

  # Postgres
  PostgresOption__MaxIdleConns: ${POSTGRES_MAX_IDLE_CONNS}
  PostgresOption__MaxOpenConns: ${POSTGRES_MAX_OPEN_CONNS}
  PostgresOption__ConnMaxLifetime: ${POSTGRES_CONN_MAX_LIFETIME}

  # JWT (validation only — this service no longer issues tokens; taskcoper-be does.
  # These three MUST be identical to taskcoper-be's values for cross-service tokens to validate.)
  JwtOption__Issuer: ${JWT_ISSUER}
  JwtOption__Audience: ${JWT_AUDIENCE}
  JwtOption__AccessTokenKey: ${JWT_ACCESS_TOKEN_KEY}

  # Ahamove
  AhamoveOption__Token: ${AHAMOVE_TOKEN}
  AhamoveOption__BaseUrl: ${AHAMOVE_BASE_URL}

  # XanhSM Express
  XanhSmOptions__BaseUrl: ${XANHSM_BASE_URL}
  XanhSmOptions__TokenUrl: ${XANHSM_TOKEN_URL}
  XanhSmOptions__Scope: ${XANHSM_SCOPE}
  XanhSmOptions__ClientId: ${XANHSM_CLIENT_ID}
  XanhSmOptions__ClientSecret: ${XANHSM_CLIENT_SECRET}
  XanhSmOptions__AcceptLanguage: ${XANHSM_ACCEPT_LANGUAGE}

  # NhanhVn
  NhanhVnOption__Token: ${NHANHVN_TOKEN}
  NhanhVnOption__AppId: ${NHANHVN_APP_ID}
  NhanhVnOption__BusinessId: ${NHANHVN_BUSINESS_ID}
  NhanhVnOption__BaseUrl: ${NHANHVN_BASE_URL}

  # BaoKim (payment gateway — the keys are PEM blocks; their newlines pass through as-is).
  # PrivateKey signs our outbound calls; PublicKey is BaoKim's, used to verify inbound webhooks.
  BaoKimOption__BaseUrl: ${BAOKIM_BASE_URL}
  BaoKimOption__MerchantCode: ${BAOKIM_MERCHANT_CODE}
  BaoKimOption__ClientId: ${BAOKIM_CLIENT_ID}
  BaoKimOption__ClientSecret: ${BAOKIM_CLIENT_SECRET}
  BaoKimOption__PrivateKey: ${BAOKIM_PRIVATE_KEY}
  BaoKimOption__PublicKey: ${BAOKIM_PUBLIC_KEY}

  SepayOption__ApiKey: ${SEPAY_API_KEY}

  # Revalidate (outbound cache purge to the storefront: POST BaseUrl with "x-revalidate-secret: <SecretKey>")
  SecretOptions__BaseUrl: ${SECRET_BASE_URL}
  SecretOptions__SecretKey: ${SECRET_KEY}

  AllowedHosts: "*"

x-api-base: &api-base
  image: ${REGISTRY}/hoatheomua-api:${TAG:-latest}
  build:
    context: ..
    dockerfile: HoaTheoMua.API/Dockerfile
  restart: unless-stopped

services:
  hoatheomua-postgres-dev:
    <<: *postgres-base
    container_name: hoatheomua-postgres-dev
    hostname: hoatheomua-postgres-dev
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    networks: [hoatheomua-network-dev]
    volumes:
      - postgres-hoatheomua-data-dev:/var/lib/postgresql/data
    profiles: [dev, database-dev, database, dev-pull]

  hoatheomua-postgres-prod:
    <<: *postgres-base
    container_name: hoatheomua-postgres-prod
    hostname: hoatheomua-postgres-prod
    ports: ["${POSTGRES_PORT:-5433}:5432"]
    networks: [hoatheomua-network-prod]
    volumes:
      - postgres-hoatheomua-data-prod:/var/lib/postgresql/data
    profiles: [prod, database-prod, database, prod-pull]

  hoatheomua-api-dev:
    <<: *api-base
    container_name: hoatheomua-api-dev
    hostname: hoatheomua-api-dev
    environment:
      <<: *api-env
      ConnectionStrings__PostgresSql: Host=hoatheomua-postgres-dev;Port=5432;Database=${POSTGRES_DBNAME};Username=${POSTGRES_USERNAME};Password=${POSTGRES_PASSWORD}
    # ports:
    #   - "${HTTP_PORT}:8080"
    networks: [hoatheomua-network-dev]
    profiles: [dev, api-dev, api, dev-pull]

  hoatheomua-api-prod:
    <<: *api-base
    container_name: hoatheomua-api-prod
    hostname: hoatheomua-api-prod
    environment:
      <<: *api-env
      ConnectionStrings__PostgresSql: Host=hoatheomua-postgres-prod;Port=5432;Database=${POSTGRES_DBNAME};Username=${POSTGRES_USERNAME};Password=${POSTGRES_PASSWORD}
    ports:
      - "${HTTP_PORT}:8080"
    networks: [hoatheomua-network-prod]
    profiles: [prod, api-prod, api, prod-pull]

  hoatheomua-cloudflare-dev:
    <<: *cloudflare-tunnel
    container_name: hoatheomua-cloudflare-dev
    hostname: hoatheomua-cloudflare-dev
    networks: [hoatheomua-network-dev]
    profiles: [dev, cloudflare-dev, proxy, dev-pull]

volumes:
  postgres-hoatheomua-data-dev:
    name: postgres-hoatheomua-data-dev
    driver: local
  postgres-hoatheomua-data-prod:
    name: postgres-hoatheomua-data-prod
    driver: local

networks:
  hoatheomua-network-dev:
    name: hoatheomua-network-dev
    driver: bridge
    ipam:
      driver: default
  hoatheomua-network-prod:
    name: hoatheomua-network-prod
    driver: bridge
    ipam:
      driver: default
