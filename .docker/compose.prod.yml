# Prod overlay for docker-compose.yml — prod container names, prod-scoped volumes, prod environment.
# Usage: docker compose -f .docker/docker-compose.yml -f .docker/compose.prod.yml up -d
# (Run one environment at a time with its own .env; use compose.yaml profiles to run dev + prod side by side.)
services:
  hoatheomua-postgres:
    container_name: hoatheomua-postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DBNAME}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-hoatheomua-data-prod:/var/lib/postgresql/data

  hoatheomua-rabbitmq:
    container_name: hoatheomua-rabbitmq-prod
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq-hoatheomua-data-prod:/var/lib/rabbitmq

  hoatheomua-api:
    container_name: hoatheomua-api-prod
    environment:
      TZ: UTC

      # Environment Configuration
      Environment: ${ENVIRONMENT}
      ASPNETCORE_ENVIRONMENT: ${ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      HttpPort: ${HTTP_PORT}

      # Connection Strings
      ConnectionStrings__PostgresSql: Host=hoatheomua-postgres;Port=5432;Database=${POSTGRES_DBNAME};Username=${POSTGRES_USERNAME};Password=${POSTGRES_PASSWORD}

      # Postgres Configuration
      PostgresOption__MaxIdleConns: ${POSTGRES_MAX_IDLE_CONNS}
      PostgresOption__MaxOpenConns: ${POSTGRES_MAX_OPEN_CONNS}
      PostgresOption__ConnMaxLifetime: ${POSTGRES_CONN_MAX_LIFETIME}

      # JWT Configuration (validation only — taskcoper-be issues tokens.
      # These three MUST match taskcoper-be's values for cross-service validation.)
      JwtOption__Issuer: ${JWT_ISSUER}
      JwtOption__Audience: ${JWT_AUDIENCE}
      JwtOption__AccessTokenKey: ${JWT_ACCESS_TOKEN_KEY}

      # Ahamove Configuration
      AhamoveOption__Token: ${AHAMOVE_TOKEN}
      AhamoveOption__BaseUrl: ${AHAMOVE_BASE_URL}

      # XanhSM Express
      XanhSmOptions__BaseUrl: ${XANHSM_BASE_URL}
      XanhSmOptions__TokenUrl: ${XANHSM_TOKEN_URL}
      XanhSmOptions__Scope: ${XANHSM_SCOPE}
      XanhSmOptions__ClientId: ${XANHSM_CLIENT_ID}
      XanhSmOptions__ClientSecret: ${XANHSM_CLIENT_SECRET}
      XanhSmOptions__AcceptLanguage: ${XANHSM_ACCEPT_LANGUAGE}
      XanhSmWebhookOptions__Environment: ${XANHSM_WEBHOOK_ENVIRONMENT:-}
      XanhSmWebhookOptions__SigningKey: ${XANHSM_WEBHOOK_SIGNING_KEY:-}
      XanhSmWebhookOptions__SecondarySigningKey: ${XANHSM_WEBHOOK_SECONDARY_SIGNING_KEY:-}

      # NhanhVn Configuration
      NhanhVnOption__Token: ${NHANHVN_TOKEN}
      NhanhVnOption__AppId: ${NHANHVN_APP_ID}
      NhanhVnOption__BusinessId: ${NHANHVN_BUSINESS_ID}
      NhanhVnOption__BaseUrl: ${NHANHVN_BASE_URL}

      # BaoKim Configuration (the keys are PEM blocks with real newlines).
      # PublicKey is BaoKim's own key, used to verify inbound webhook signatures.
      BaoKimOption__BaseUrl: ${BAOKIM_BASE_URL}
      BaoKimOption__MerchantCode: ${BAOKIM_MERCHANT_CODE}
      BaoKimOption__ClientId: ${BAOKIM_CLIENT_ID}
      BaoKimOption__ClientSecret: ${BAOKIM_CLIENT_SECRET}
      BaoKimOption__PrivateKey: ${BAOKIM_PRIVATE_KEY}
      BaoKimOption__PublicKey: ${BAOKIM_PUBLIC_KEY}

      # Sepay Configuration (verifies the "Authorization: Apikey <ApiKey>" header on inbound webhooks)
      SepayOption__ApiKey: ${SEPAY_API_KEY}

      # Frontend base URL (used to build admin order links sent to NhanhVn)
      FrontendOption__BaseUrl: ${FE_BASE_URL}

      # Revalidate Configuration (outbound cache purge to the storefront:
      # POST BaseUrl with header "x-revalidate-secret: <SecretKey>")
      SecretOptions__BaseUrl: ${SECRET_BASE_URL}
      SecretOptions__SecretKey: ${SECRET_KEY}

      # Allowed Hosts
      AllowedHosts: "*"
    volumes:
      - ./logs:/app/logs

volumes:
  postgres-hoatheomua-data-prod:
    name: postgres-hoatheomua-data-prod
    driver: local
  rabbitmq-hoatheomua-data-prod:
    name: rabbitmq-hoatheomua-data-prod
    driver: local
