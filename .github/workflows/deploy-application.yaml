name: Deploy Production Server
on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string
      actor:
        required: true
        type: string
      repository:
        required: true
        type: string
      run-on:
        required: false
        default: self-hosted
        type: string
      tag:
        required: false
        default: develop-latest
        type: string
      environment:
        required: false
        default: dev
        type: string
      pull-profile:
        required: false
        default: dev-pull
        type: string
jobs:
  deploy-application:
    runs-on: ${{ inputs.run-on }}
    environment: ${{ inputs.environment }}
    env:
      REGISTRY: ghcr.io/${{ inputs.repository }}

      # Environment
      ENVIRONMENT: ${{ secrets.ENVIRONMENT }}

      # HTTP
      HTTP_PORT: ${{ secrets.HTTP_PORT }}

      # Postgres
      POSTGRES_DBNAME: ${{ secrets.POSTGRES_DBNAME }}
      POSTGRES_USERNAME: ${{ secrets.POSTGRES_USERNAME }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_MAX_IDLE_CONNS: ${{ secrets.POSTGRES_MAX_IDLE_CONNS }}
      POSTGRES_MAX_OPEN_CONNS: ${{ secrets.POSTGRES_MAX_OPEN_CONNS }}
      POSTGRES_CONN_MAX_LIFETIME: ${{ secrets.POSTGRES_CONN_MAX_LIFETIME }}

      # JWT (validation only — taskcoper-be issues tokens.
      # These three secrets MUST equal taskcoper-be's for cross-service validation.)
      JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
      JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}
      JWT_ACCESS_TOKEN_KEY: ${{ secrets.JWT_ACCESS_TOKEN_KEY }}

      # Ahamove
      AHAMOVE_TOKEN: ${{ secrets.AHAMOVE_TOKEN }}
      AHAMOVE_BASE_URL: ${{ secrets.AHAMOVE_BASE_URL }}

      # NhanhVn
      NHANHVN_TOKEN: ${{ secrets.NHANHVN_TOKEN }}
      NHANHVN_APP_ID: ${{ secrets.NHANHVN_APP_ID }}
      NHANHVN_BUSINESS_ID: ${{ secrets.NHANHVN_BUSINESS_ID }}
      NHANHVN_BASE_URL: ${{ secrets.NHANHVN_BASE_URL }}

      # BaoKim (PRIVATE_KEY is a multi-line PEM secret — GitHub preserves its newlines)
      BAOKIM_BASE_URL: ${{ secrets.BAOKIM_BASE_URL }}
      BAOKIM_MERCHANT_CODE: ${{ secrets.BAOKIM_MERCHANT_CODE }}
      BAOKIM_CLIENT_ID: ${{ secrets.BAOKIM_CLIENT_ID }}
      BAOKIM_CLIENT_SECRET: ${{ secrets.BAOKIM_CLIENT_SECRET }}
      BAOKIM_PRIVATE_KEY: ${{ secrets.BAOKIM_PRIVATE_KEY }}

      # Cloudflare
      CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}

      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        run: |
          REPO_LOWER=$(echo "${{ inputs.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REGISTRY=ghcr.io/$REPO_LOWER" >> $GITHUB_ENV
      - name: Pull New Image From Registry
        run: docker compose -f .docker/compose.yaml -p hoatheomua-server-${{ inputs.profile }} --profile ${{ inputs.pull-profile }} pull

      - name: Deploy New Image
        run: docker compose -f .docker/compose.yaml -p hoatheomua-server-${{ inputs.profile }} --profile ${{ inputs.environment }} up -d

      - name: Prune Old Image
        run: docker image prune -af

      - name: Notify Deployment Success
        run: |
          echo "Deployment completed successfully!"
          echo "API is running and healthy"
