name: Deploy Production Server
on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string
      actor:
        required: true
        type: string
      repository:
        required: true
        type: string
      run-on:
        required: false
        default: self-hosted
        type: string
      tag:
        required: false
        default: develop-latest
        type: string
      environment:
        required: false
        default: dev
        type: string
      pull-profile:
        required: false
        default: dev-pull
        type: string
jobs:
  deploy-application:
    runs-on: ${{ inputs.run-on }}
    environment: ${{ inputs.environment }}
    env:
      REGISTRY: ghcr.io/${{ inputs.repository }}

      # Environment
      ENVIRONMENT: ${{ secrets.ENVIRONMENT }}

      # HTTP
      HTTP_PORT: ${{ secrets.HTTP_PORT }}

      # Postgres
      POSTGRES_DBNAME: ${{ secrets.POSTGRES_DBNAME }}
      POSTGRES_USERNAME: ${{ secrets.POSTGRES_USERNAME }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_MAX_IDLE_CONNS: ${{ secrets.POSTGRES_MAX_IDLE_CONNS }}
      POSTGRES_MAX_OPEN_CONNS: ${{ secrets.POSTGRES_MAX_OPEN_CONNS }}
      POSTGRES_CONN_MAX_LIFETIME: ${{ secrets.POSTGRES_CONN_MAX_LIFETIME }}

      # JWT (validation only — taskcoper-be issues tokens.
      # These three secrets MUST equal taskcoper-be's for cross-service validation.)
      JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
      JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}
      JWT_ACCESS_TOKEN_KEY: ${{ secrets.JWT_ACCESS_TOKEN_KEY }}

      # AI Flower storage (runtime only, GitHub Environment Secrets for dev/prod).
      TASKCOPER_API_BASE: ${{ secrets.TASKCOPER_API_BASE }}
      TASKCOPER_EMAIL: ${{ secrets.TASKCOPER_EMAIL }}
      TASKCOPER_PASSWORD: ${{ secrets.TASKCOPER_PASSWORD }}
      TASKCOPER_STORAGE_PREFIX: ${{ secrets.TASKCOPER_STORAGE_PREFIX }}
      FLOWER_IMAGE_PUBLIC_BASE_URL: ${{ secrets.FLOWER_IMAGE_PUBLIC_BASE_URL }}

      # PostGen (GitHub Environment Secrets, dev/prod isolated; runtime only).
      POSTGEN_META_ENABLED: ${{ secrets.POSTGEN_META_ENABLED }}
      POSTGEN_META_APP_ID: ${{ secrets.POSTGEN_META_APP_ID }}
      POSTGEN_META_APP_SECRET: ${{ secrets.POSTGEN_META_APP_SECRET }}
      POSTGEN_META_GRAPH_API_VERSION: ${{ secrets.POSTGEN_META_GRAPH_API_VERSION }}
      POSTGEN_META_CONFIG_ID: ${{ secrets.POSTGEN_META_CONFIG_ID }}
      POSTGEN_META_FACEBOOK_CALLBACK_URL: ${{ secrets.POSTGEN_META_FACEBOOK_CALLBACK_URL }}
      POSTGEN_META_INSTAGRAM_CALLBACK_URL: ${{ secrets.POSTGEN_META_INSTAGRAM_CALLBACK_URL }}
      POSTGEN_ACTIVE_ENCRYPTION_KEY_ID: ${{ secrets.POSTGEN_ACTIVE_ENCRYPTION_KEY_ID }}
      POSTGEN_ENCRYPTION_KEY_K1: ${{ secrets.POSTGEN_ENCRYPTION_KEY_K1 }}
      POSTGEN_ENCRYPTION_KEY_K2: ${{ secrets.POSTGEN_ENCRYPTION_KEY_K2 }}
      POSTGEN_OAUTH_STATE_MINUTES: ${{ secrets.POSTGEN_OAUTH_STATE_MINUTES }}
      POSTGEN_REQUEST_TIMEOUT_SECONDS: ${{ secrets.POSTGEN_REQUEST_TIMEOUT_SECONDS }}
      POSTGEN_PUBLISH_FACEBOOK_ENABLED: ${{ secrets.POSTGEN_PUBLISH_FACEBOOK_ENABLED }}
      POSTGEN_PUBLISH_INSTAGRAM_ENABLED: ${{ secrets.POSTGEN_PUBLISH_INSTAGRAM_ENABLED }}
      POSTGEN_SCHEDULE_MIN_LEAD_SECONDS: ${{ secrets.POSTGEN_SCHEDULE_MIN_LEAD_SECONDS }}
      POSTGEN_SCHEDULE_MAX_DAYS: ${{ secrets.POSTGEN_SCHEDULE_MAX_DAYS }}
      POSTGEN_SCHEDULE_LATENESS_SECONDS: ${{ secrets.POSTGEN_SCHEDULE_LATENESS_SECONDS }}

      # Ahamove
      AHAMOVE_TOKEN: ${{ secrets.AHAMOVE_TOKEN }}
      AHAMOVE_BASE_URL: ${{ secrets.AHAMOVE_BASE_URL }}

      # RabbitMQ (MassTransit bus behind the fulfilment saga; maps to RabbitMqOptions__*)
      RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
      RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
      RABBITMQ_VHOST: ${{ secrets.RABBITMQ_VHOST }}
      RABBITMQ_PORT: ${{ secrets.RABBITMQ_PORT }}
      RABBITMQ_MANAGEMENT_PORT: ${{ secrets.RABBITMQ_MANAGEMENT_PORT }}

      # XanhSM Express
      XANHSM_BASE_URL: ${{ secrets.XANHSM_BASE_URL }}
      XANHSM_TOKEN_URL: ${{ secrets.XANHSM_TOKEN_URL }}
      XANHSM_SCOPE: ${{ secrets.XANHSM_SCOPE }}
      XANHSM_CLIENT_ID: ${{ secrets.XANHSM_CLIENT_ID }}
      XANHSM_CLIENT_SECRET: ${{ secrets.XANHSM_CLIENT_SECRET }}
      XANHSM_ACCEPT_LANGUAGE: ${{ secrets.XANHSM_ACCEPT_LANGUAGE }}

      # NhanhVn
      NHANHVN_TOKEN: ${{ secrets.NHANHVN_TOKEN }}
      NHANHVN_APP_ID: ${{ secrets.NHANHVN_APP_ID }}
      NHANHVN_BUSINESS_ID: ${{ secrets.NHANHVN_BUSINESS_ID }}
      NHANHVN_BASE_URL: ${{ secrets.NHANHVN_BASE_URL }}

      # BaoKim (the KEY secrets are multi-line PEM blocks — GitHub preserves their newlines).
      # PUBLIC_KEY is BaoKim's own key and verifies inbound webhook signatures.
      BAOKIM_BASE_URL: ${{ secrets.BAOKIM_BASE_URL }}
      BAOKIM_MERCHANT_CODE: ${{ secrets.BAOKIM_MERCHANT_CODE }}
      BAOKIM_CLIENT_ID: ${{ secrets.BAOKIM_CLIENT_ID }}
      BAOKIM_CLIENT_SECRET: ${{ secrets.BAOKIM_CLIENT_SECRET }}
      BAOKIM_PRIVATE_KEY: ${{ secrets.BAOKIM_PRIVATE_KEY }}
      BAOKIM_PUBLIC_KEY: ${{ secrets.BAOKIM_PUBLIC_KEY }}

      # Sepay (verifies the "Authorization: Apikey <ApiKey>" header on inbound webhooks)
      SEPAY_API_KEY: ${{ secrets.SEPAY_API_KEY }}

      # Revalidate (outbound cache purge to the storefront:
      # POST SECRET_BASE_URL with header "x-revalidate-secret: <SECRET_KEY>")
      SECRET_BASE_URL: ${{ secrets.SECRET_BASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

      # Cloudflare
      CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}

      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Validate PostGen Environment
        shell: bash
        run: bash .docker/validate-postgen-env.sh

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        run: |
          REPO_LOWER=$(echo "${{ inputs.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REGISTRY=ghcr.io/$REPO_LOWER" >> $GITHUB_ENV

      - name: Pull New Image From Registry
        run: docker compose -f .docker/compose.yaml -p hoatheomua-server-${{ inputs.profile }} --profile ${{ inputs.pull-profile }} pull

      - name: Deploy New Image
        run: docker compose -f .docker/compose.yaml -p hoatheomua-server-${{ inputs.profile }} --profile ${{ inputs.environment }} up -d

      - name: Prune Old Image
        run: docker image prune -af

      - name: Notify Deployment Success
        run: |
          echo "Deployment completed successfully!"
          echo "API is running and healthy"
